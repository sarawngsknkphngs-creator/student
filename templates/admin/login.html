{% extends "base.html" %}

{% block title %}เข้าสู่ระบบสำหรับเจ้าหน้าที่ - งานรับสมัครและทะเบียน{% endblock %}

{% block content %}
<script>
    if (window.location.protocol === 'file:') {
        window.location.replace('http://127.0.0.1:8000/admin/login');
    }
</script>
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-700 rounded-2xl flex items-center justify-center mx-auto mb-3">
                <i data-lucide="shield-alert" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">เข้าสู่ระบบเจ้าหน้าที่</h1>
            <p class="text-xs text-slate-500 mt-1">งานรับสมัครและงานทะเบียน วิทยาลัยอาชีวศึกษา</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-xs flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" name="username" required value="admin"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required value="admin123"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm">
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-700 hover:bg-indigo-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-700/20 transition flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> เข้าสู่ระบบจัดการ
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <span class="text-xs text-slate-400">ชื่อผู้ใช้เริ่มต้น: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">admin</code> รหัสผ่าน: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">admin123</code></span>
        </div>
    </div>
</div>
{% endblock %}
